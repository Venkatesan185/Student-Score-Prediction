<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Performance</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h1>Student Performance</h1>

    <section class="card">
      <h2>Prediction</h2>
      <form id="predictForm" class="grid">
        <label>Hours Studied</label><input name="Hours_Studied" type="number" step="0.01" required />
        <label>Attendance</label><input name="Attendance" type="number" step="0.01" required />
        <label>Parental Involvement</label><input name="Parental_Involvement" type="text" required />
        <label>Access to Resources</label><input name="Access_to_Resources" type="text" required />
        <label>Extracurricular Activities</label><input name="Extracurricular_Activities" type="text" required />
        <label>Sleep Hours</label><input name="Sleep_Hours" type="number" step="0.01" required />
        <label>Previous Scores</label><input name="Previous_Scores" type="number" step="0.01" required />
        <label>Motivation Level</label><input name="Motivation_Level" type="text" required />
        <label>Internet Access</label><input name="Internet_Access" type="text" required />
        <label>Tutoring Sessions</label><input name="Tutoring_Sessions" type="number" step="1" required />
        <button type="submit" class="primary">Predict</button>
      </form>
      <div id="predictResult" class="result" aria-live="polite"></div>
    </section>

    <section class="card">
      <h2>Students (CRUD)</h2>

      <form id="createForm" class="grid">
        <h3 class="grid-title" style="grid-column: 1 / -1; margin: 0;">Add Student</h3>
        <label>Hours Studied</label><input name="Hours_Studied" type="number" step="0.01" required />
        <label>Attendance</label><input name="Attendance" type="number" step="0.01" required />
        <label>Parental Involvement</label><input name="Parental_Involvement" type="text" required />
        <label>Access to Resources</label><input name="Access_to_Resources" type="text" required />
        <label>Extracurricular Activities</label><input name="Extracurricular_Activities" type="text" required />
        <label>Sleep Hours</label><input name="Sleep_Hours" type="number" step="0.01" required />
        <label>Previous Scores</label><input name="Previous_Scores" type="number" step="0.01" required />
        <label>Motivation Level</label><input name="Motivation_Level" type="text" required />
        <label>Internet Access</label><input name="Internet_Access" type="text" required />
        <label>Tutoring Sessions</label><input name="Tutoring_Sessions" type="number" step="1" required />
        <button type="submit" class="primary">Create</button>
      </form>

      <hr />

      <div class="controls">
        <button id="refreshBtn" class="primary">Refresh List</button>
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Hours</th>
            <th>Attendance</th>
            <th>Parental</th>
            <th>Resources</th>
            <th>Extracurricular</th>
            <th>Sleep</th>
            <th>Prev</th>
            <th>Motivation</th>
            <th>Internet</th>
            <th>Tutoring</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentsTbody"></tbody>
      </table>

      <div id="crudMessage" class="result" aria-live="polite"></div>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
